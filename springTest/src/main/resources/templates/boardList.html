<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<title>Insert title here</title>
</head>
<body>
<!-- 게시글 단건조회 시작부 -->
<!-- 게시글 단건조회 종료부 -->

<!-- 게시글조회 시작부 -->
<table class="table">
<tr>
<th>글번호</th>
<th>글제목</th>
<th>글내용</th>
<th>작성자</th>
<th>등록일</th>
<th>수정일</th>
</tr>
<tr th:each="board : ${boardList}">
<td th:text="${board.bno}"></td>
<td><a th:href="@{/reply(bno=${board.bno})}" th:text="${board.title}"></a></td>
<td th:text="${board.content}"></td>
<td th:text="${board.writer}"></td>
<td th:text="${  #dates.format(board.regDate, 'yyyy-MM-dd')  }"></td>
<td th:text="${  #dates.format(board.updateDate,'yyyy-MM-dd')  }"></td>
</tr>
</table>
<!-- 게시글조회 종료부 -->
<!-- 댓글조회 시작부 -->
<div id="replyList"></div>
<!-- 댓글종료 시작부 -->

<!-- 댓글등록 시작부 -->
<form id="frm">
	<input name="reply">
	<input name="replyer">
	<input name="bno" type="hidden" th:value="${board.bno}">
	<button type="button" class="btnReplyInsert">댓글작성</button>
</form>
<!-- 댓글등록 종료부 -->

</body>
<script>
replyInsert();
/*-------------------------------------
댓글 조회 ajax 호출
---------------------------------------*/
function replyList(){
	const url = `/reply/pages/${bno}/1`
	fetch( url )
	.then( result => result.json() )
	.then( result => replyListCallback(result) )
}

/*-------------------------------------
등록 버튼 이벤트 지정
---------------------------------------*/	
const url = "/reply";
function replyInsert(){
	document.querySelector(".btnReplyInsert").addEventListener("click", function(){

		//파라미터 만들기
		const reply = frm.reply.value;
		const replyer = frm.replyer.value;
		const bno = frm.bno.value;
		const param = {reply, replyer, bno}
		
		//등록 요청
		fetch(url, {
			method:"post",
			headers: {
			      "Content-Type": "application/json",
			      // 'Content-Type': 'application/x-www-form-urlencoded',
			    },
			body : JSON.stringify(param), 
		})
		.then( result => result.text() )
		.then( result => alert(result) )
		// .then( result => replyList() )
	})
} 

</script>
</html>
