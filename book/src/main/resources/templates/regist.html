<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style type="text/css">
img {
	width:30px;
}

.container{
background-color: lightgreen;
}
header > h1{
background-color: gray;
margin:0px;
padding:0px;
}
menu {
background-color: black;
}
menu > li{
display : inline-block;
margin-right: 20px; 

}

menu > li > a {
  text-decoration: none;   
  color: white;            
}

menu > li > a:hover {
  text-decoration: underline; 
           
}

</style>


<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<title>Insert title here</title>
</head>
<body class="container">
<header>
<h1>도서대여관리 프로그램</h1>
</header>
<menu>
<li><a href="/regist">도서등록</a></li>
<li><a href="/book">도서목록조회/수정</a></li>
<li><a href="/rentList">대여현황조회</a></li>
<li><a href="/">흠으로</a></li>
</menu>
<div class="container">
<header><h2 class="text-center">도서 등록</h2></header>
<div class="card-body">
<form action="register" method="post" enctype="application/x-www-form-urlencoded">
	<div class="mb-3">
	<label for="bookNo" class="form-label">도서번호</label> 
	<input type="text" class="form-control" name="bookNo" placeholder="번호입력" th:value="${max}">
	</div>
	<div class="mb-3">
	<label for="bookName" class="form-label">도서명</label> 
	<input type="text" class="form-control" name="bookName" placeholder="이름입력" required  oninvalid="this.setCustomValidity('도서명이 입력되지 않았습니다.')">
	</div>
	<div class="mb-3">
	<label for="bookCoverimg" class="form-label">도서 표지</label>
	<input type="text" class="form-control" name="bookCoverimg">
	</div>
	<div class="mb-3">
	<label for="bookDate" class="form-label">출판일자</label> 
	<input type="date" class="form-control" name="bookDate">
	</div>
	<div class="mb-3">
	<label for="bookPrice" class="form-label">금액</label> <input
	type="text" class="form-control" name="bookPrice">
	</div>
	<div class="mb-3">
	<label for="bookInfo" class="form-label">도서소개</label> <textarea
	class="form-control" name="bookInfo" rows="5"></textarea>
	</div>
	<div class="d-flex justify-content-end gap-2">
		<button class="btn btn-success">등록</button>
		<button class="btn btn-info" onclick="location.href='/book'">조회</button>
	</div>
	
	
</form>
</div>

</div>
</body>
</html>
