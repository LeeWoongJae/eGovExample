<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style type="text/css">
img {
	width:30px;
}

body{
background-color: lightgreen;
}
header > h1{
background-color: gray;
margin:0px;
padding:0px;
}
menu {
background-color: black;
}
menu > li{
display : inline-block;
margin-right: 20px; 

}

menu > li > a {
  text-decoration: none;   
  color: white;            
}

menu > li > a:hover {
  text-decoration: underline; 
           
}

</style>


<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<title>Insert title here</title>
</head>
<body>
<header>
<h1>도서대여관리 프로그램</h1>
</header>
<menu>
<li><a href="/regist">도서등록</a></li>
<li><a href="/book">도서목록조회/수정</a></li>
<li><a href="/rentList">대여현황조회</a></li>
<li><a href="/">흠으로</a></li>
</menu>
<table class="table">
<tr>
<th>도서번호</th>
<th>도서명</th>
<th>표지</th>
<th>출판일자</th>
<th>금액</th>
<th>출판사</th>
<th>도서소개</th>
</tr>
<tr th:each="b : ${list}">
<td th:text="${b.bookNo}"></td>
<td><a th:href="@{/book/{bookName}(bookName=${b.bookName})}" th:text="${b.bookName}"></a></td>
<td><img th:src="'/'+${b.bookCoverimg}" th:alt="${b.bookCoverimg}"></td>
<td th:text="${ #dates.format(b.bookDate, 'yyyy/MM/dd') }"></td>
<td th:text="${ #numbers.formatInteger(b.bookPrice,2,'COMMA')}"></td>
<td th:text="${b.bookPublisher}"></td>
<td th:text="${b.bookInfo}"></td>
</tr>
</table>
<div class="d-flex justify-content-center">
<button type="button" class="btn btn-primary" onclick="location.href='/regist'">책 등록</button>
<button type="button" class="btn btn-primary" onclick="location.href='/rentList'">매출현황</button>
</div>
</body>
</html>
